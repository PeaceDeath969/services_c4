services:
  app:
    build:
      context: ./services/app
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  likec4:
    image: likec4/likec4:latest
    working_dir: /data
    volumes:
      - ./:/data
    command: ["start", "docs/c4", "--listen", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
      - "24678:24678"
